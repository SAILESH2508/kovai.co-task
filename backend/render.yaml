services:
  - type: web
    name: taskflow-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false          # Set manually in Render dashboard — never hardcode
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true  # Render generates a secure random value automatically
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false          # Set to your Vercel URL after deployment

databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow_user
    plan: free
